
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Nginx Lab - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #2563eb);
            color: #1f2937;
        }

        .login-card {
            width: min(90%, 380px);
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px #0003;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #60a5fa;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #b91c1c;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Docker Lab</h1>
        <p class="subtitle">Accedi</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="nome@esempio.it"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Almeno 4 caratteri"
                autocomplete="off"
                minlength="4"
                required
            >

            <button type="submit">Accedi</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <footer>
            Pagina servita da Nginx su Docker
        </footer>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || password.length < 4) {
                message.textContent =
                    "Inserisci un'email valida e almeno 4 caratteri.";
                message.className = "error";
                return;
            }

            message.textContent =
                "Demo completata! Benvenuto, " + email + ".";
            message.className = "success";
        });
    </script>
</body>
</html>
